<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Live Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #111; color: #fff; }
        #map { height: 70%; width: 100%; }
        #info-panel { height: 30%; padding: 15px; box-sizing: border-box; overflow-y: auto; font-size: 1.2em; }
        .flight-item { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="info-panel">
        <h2>Flights Overhead (MSP Path)</h2>
        <div id="flights-list">Initializing radar tracking grid...</div>
    </div>

    <script data-cfasync="false" type="text/javascript">
        window.addEventListener('load', () => {
            
            // Your exact Apple Valley home coordinate variables
            const homeLat = 44.7375513;
            const homeLng = -93.2008404;
            
            const map = L.map('map').setView([homeLat, homeLng], 11); 
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            const homeMarker = L.marker([homeLat, homeLng]).addTo(map).bindPopup('My House').openPopup();

            let markers = [];

            function clearMarkers() {
                markers.forEach(m => map.removeLayer(m));
                markers = [];
            }

            async function getFlights() {
                // Querying a 25 nautical mile tracking zone centered over your roof
                const url = `https://api.adsb.lol/v2/lat/${homeLat}/lon/${homeLng}/dist/25`;
                
                try {
                    // Inject explicit structural headers into the request to force clean json returns
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'Cache-Control': 'no-cache'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP grid loss: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // If Cloudflare sends an unexpected structural wrapper, intercept it gracefully
                    let aircraftArray = [];
                    if (data && data.ac) {
                        aircraftArray = data.ac;
                    } else if (Array.isArray(data)) {
                        aircraftArray = data;
                    }
                    
                    if (aircraftArray.length === 0) {
                        document.getElementById('flights-list').innerHTML = 'No planes detected inside local airspace.';
                        clearMarkers();
                        return;
                    }
                    
                    updateMapAndPanel(aircraftArray);
                } catch (error) {
                    console.error("Airspace read error:", error);
                }
            }

            function updateMapAndPanel(aircraftList) {
                clearMarkers();
                
                const listDiv = document.getElementById('flights-list');
                listDiv.innerHTML = '';

                aircraftList.forEach(plane => {
                    // Extract fields from standard readsb data formats
                    const callsign = plane.flight ? plane.flight.trim() : (plane.r || "UNKNOWN");
                    const latitude = plane.lat;
                    const longitude = plane.lon;
                    const altitude = plane.alt_baro || plane.alt_geom || 0; 
                    const velocity = plane.gs ? Math.round(plane.gs) : 0; 
                    const type = plane.t || "Aircraft"; 

                    if (latitude && longitude) {
                        const marker = L.marker([latitude, longitude])
                            .bindPopup(`<b>✈️ ${callsign} (${type})</b><br>Alt: ${altitude} ft<br>Speed: ${velocity} kts`)
                            .addTo(map);
                        markers.push(marker);

                        listDiv.innerHTML += `
                            <div class="flight-item">
                                <strong>✈️ Target ${callsign}</strong> (${type}) | Alt: ${altitude} ft | Speed: ${velocity} kts
                            </div>`;
                    }
                });
                
                if(listDiv.innerHTML === '') {
                    listDiv.innerHTML = 'Scanning overhead flight corridors...';
                }
            }

            // Loop parameters set to 10-second spacing cycles
            getFlights();
            setInterval(getFlights, 10000);
        });
    </script>
</body>
</html>
