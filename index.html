<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Flight Radar Launchpad</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-size: 1.5em;
        }
    </style>
    <script>
        // Directly targets your Apple Valley coordinates
        const homeLat = 44.7375;
        const homeLon = -93.2008;
        const zoomLevel = 11;

        // The exact direct radar link
        const radarUrl = `https://adsb.fi/?lat=${homeLat}&lon=${homeLon}&zoom=${zoomLevel}`;

        // The split-second the page opens, forcefully redirect the browser window
        window.location.replace(radarUrl);
    </script>
</head>
<body>
    <div>Connecting to live Apple Valley airspace grid...</div>
</body>
</html>
