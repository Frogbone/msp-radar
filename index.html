<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Live Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #111; color: #fff; }
        #map { height: 70%; width: 100%; }
        #info-panel { height: 30%; padding: 15px; box-sizing: border-box; overflow-y: auto; font-size: 1.2em; }
        .flight-item { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="info-panel">
        <h2>Flights Overhead (MSP Path)</h2>
        <div id="flights-list">Initializing radar tracking grid...</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            // Your exact Apple Valley coordinates
            const homeLat = 44.7375513;
            const homeLng = -93.2008404;
            
            const map = L.map('map').setView([homeLat, homeLng], 11); 
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            L.marker([homeLat, homeLng]).addTo(map).bindPopup('My House').openPopup();

            let markers = [];

            function clearMarkers() {
                markers.forEach(m => map.removeLayer(m));
                markers = [];
            }

            async function getFlights() {
                // Outer boundaries covering the local MSP arrival/departure tracks
                const lamin = 44.55;
                const lomin = -93.45;
                const lamax = 44.95;
                const lomax = -92.95;
                
                const targetUrl = `https://opensky-network.org/api/states/all?lamin=${lamin}&lomin=${lomin}&lamax=${lamax}&lomax=${lomax}`;
                
                // Using corsproxy.io which natively adds the flawless Access-Control-Allow-Origin headers
                const url = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    
                    const data = await response.json();
                    
                    if (!data || !data.states || data.states.length === 0) {
                        document.getElementById('flights-list').innerHTML = 'No planes detected inside local airspace right now.';
                        clearMarkers();
                        return;
                    }
                    
                    updateMapAndPanel(data.states);
                } catch (error) {
                    console.error("Airspace read error:", error);
                    document.getElementById('flights-list').innerHTML = 'Scanning local corridors...';
                }
            }

            function updateMapAndPanel(statesList) {
                clearMarkers();
                
                const listDiv = document.getElementById('flights-list');
                listDiv.innerHTML = '';

                statesList.forEach(flight => {
                    const callsign = flight[1] ? flight[1].trim() : "UNKNOWN";
                    const longitude = flight[5];
                    const latitude = flight[6];
                    const altitude = flight[7] ? Math.round(flight[7] * 3.28084) : 0; // Convert meters to feet
                    const velocity = flight[9] ? Math.round(flight[9] * 2.23694) : 0; // Convert m/s to mph

                    if (latitude && longitude) {
                        const marker = L.marker([latitude, longitude])
                            .bindPopup(`<b>✈️ ${callsign}</b><br>Alt: ${altitude} ft<br>Speed: ${velocity} mph`)
                            .addTo(map);
                        markers.push(marker);

                        listDiv.innerHTML += `
                            <div class="flight-item">
                                <strong>✈️ Target ${callsign}</strong> | Alt: ${altitude} ft | Speed: ${velocity} mph
                            </div>`;
                    }
                });
                
                if (listDiv.innerHTML === '') {
                    listDiv.innerHTML = 'No active aircraft over Apple Valley grid points.';
                }
            }

            // OpenSky limits anonymous users to 10-second request cycles
            getFlights();
            setInterval(getFlights, 10000);
        });
    </script>
</body>
</html>
