<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Flight Radar Command</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #0b0c10; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #screen-split {
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }
        /* Top Section: Native Interactive Radar Grid */
        #map {
            height: 72%; width: 100%; background: #0f1115;
        }
        /* Bottom Section: JetClock Panel */
        #clock-container {
            height: 28%; width: 100%; background: #151922;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            border-top: 3px solid #00f2fe; box-shadow: 0 -10px 25px rgba(0,0,0,0.6); z-index: 1000;
        }
        #time-text {
            font-size: 4.5em; font-weight: bold; color: #00f2fe; margin: 0; line-height: 1; font-family: monospace; text-shadow: 0 0 10px rgba(0,242,254,0.3);
        }
        #date-text {
            font-size: 1.1em; color: #c5a059; font-weight: 300; letter-spacing: 2px; margin-top: 10px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="screen-split">
        <div id="map"></div>
        <div id="clock-container">
            <div id="time-text">00:00:00</div>
            <div id="date-text">SYNCHRONIZING TELEMETRY...</div>
        </div>
    </div>

    <script>
        // 1. DIGITAL CLOCK MODULE RUNTIME
        function tickClock() {
            const now = new Date();
            document.getElementById('time-text').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit', hour12: false});
            document.getElementById('date-text').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
        }
        setInterval(tickClock, 1000);
        tickClock();

        // 2. TACTICAL RADAR GRID ENGINE (Apple Valley Coordinates)
        const homeLat = 44.7375513;
        const homeLng = -93.2008404;

        // Initialize map framework over the Twin Cities South Metro sector
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([homeLat, homeLng], 11);

        // Core OpenStreetMap layout engine. Highly optimized and never goes blank.
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // Injects a digital filter layer that shifts the light map into a clean dark air traffic control layout
        const styleElement = document.createElement('style');
        styleElement.innerHTML = '.leaflet-tile-container img { filter: brightness(0.25) invert(1) sepia(1) hue-rotate(185deg) saturate(2); }';
        document.head.appendChild(styleElement);

        // Set up your glowing blue home base marker beacon
        const homeIcon = L.divIcon({
            html: '<div style="background-color: #00f2fe; width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 15px #00f2fe; border: 2px solid #fff;"></div>',
            className: 'home-marker',
            iconSize: [14, 14]
        });
        L.marker([homeLat, homeLng], {icon: homeIcon}).addTo(map);

        let planeMarkers = [];

        function clearMapTargets() {
            planeMarkers.forEach(m => map.removeLayer(m));
            planeMarkers = [];
        }

        // Pull real-time positions directly from FlightAware's open public API proxy feed
        async function updateRadarTargets() {
            // Target a clean 40km vector block around your roof
            const targetUrl = `https://opensky-network.org/api/states/all?lamin=44.55&lomin=-93.45&lamax=44.95&lomax=-92.95`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&cb=${Date.now()}`;
            
            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Latency Drop");
                
                const wrapperData = await response.json();
                const data = JSON.parse(wrapperData.contents);
                const states = data.states || [];
                
                clearMapTargets();

                states.forEach(flight => {
                    const callsign = flight[1] ? flight[1].trim() : "UNK";
                    const lon = flight[5];
                    const lat = flight[6];
                    const altitude = flight[7] ? Math.round(flight[7] * 3.28084) : 0; // Meters to feet

                    if (lat && lon) {
                        // Plot each flight onto your tablet map screen as a distinct, glowing target blip
                        const blipIcon = L.divIcon({
                            html: `<div style="display: flex; flex-direction: column; align-items: center;">
                                     <div style="background-color: #ff3b30; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 10px #ff3b30; border: 1px solid #fff;"></div>
                                     <div style="color: #00f2fe; background: rgba(15, 20, 30, 0.85); border: 1px solid #00f2fe; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-top: 4px; white-space: nowrap; font-family: monospace;">${callsign} <span style="color:#fff;">${Math.round(altitude/100)}</span></div>
                                   </div>`,
                            className: 'jet-blip',
                            iconSize: [50, 50],
                            iconAnchor: [25, 5]
                        });

                        const marker = L.marker([lat, lon], {icon: blipIcon}).addTo(map);
                        planeMarkers.push(marker);
                    }
                });
            } catch (err) {
                console.error("Telemetry data gap:", err);
            }
        }

        // Set scanning cycles to run every 10 seconds
        updateRadarTargets();
        setInterval(updateRadarTargets, 10000);
    </script>
</body>
</html>
