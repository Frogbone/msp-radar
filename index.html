<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Live Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #111; color: #fff; }
        #map { height: 70%; width: 100%; }
        #info-panel { height: 30%; padding: 15px; box-sizing: border-box; overflow-y: auto; font-size: 1.2em; }
        .flight-item { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="info-panel">
        <h2>Flights Overhead (MSP Path)</h2>
        <div id="flights-list">Initializing radar tracking grid...</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            // Your exact Apple Valley coordinate variables
            const homeLat = 44.7375513;
            const homeLng = -93.2008404;
            
            const map = L.map('map').setView([homeLat, homeLng], 11); 
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            L.marker([homeLat, homeLng]).addTo(map).bindPopup('My House').openPopup();

            let markers = [];

            function clearMarkers() {
                markers.forEach(m => map.removeLayer(m));
                markers = [];
            }

            // Calculate distance between two coordinate sets in kilometers
            function getDistance(lat1, lon1, lat2, lon2) {
                const R = 6371; 
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }

            async function getFlights() {
                // Fetching a reliable, live open-source dump array tracking general midwest data vectors
                const url = `https://api.adsb.lol/v2/lat/${homeLat}/lon/${homeLng}/dist/40`;
                
                try {
                    // Pull natively without proxy wrappers to prevent 522 proxy timeout triggers
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    
                    const data = await response.json();
                    const aircraftArray = data.ac || [];
                    
                    if (aircraftArray.length === 0) {
                        document.getElementById('flights-list').innerHTML = 'No planes detected inside local airspace.';
                        clearMarkers();
                        return;
                    }
                    
                    updateMapAndPanel(aircraftArray);
                } catch (error) {
                    console.error("Airspace read error:", error);
                    // Fallback option: If the main server hiccups, display scanning notification gracefully
                    document.getElementById('flights-list').innerHTML = 'Synchronizing satellite telemetry...';
                }
            }

            function updateMapAndPanel(aircraftList) {
                clearMarkers();
                
                const listDiv = document.getElementById('flights-list');
                listDiv.innerHTML = '';

                aircraftList.forEach(plane => {
                    const callsign = plane.flight ? plane.flight.trim() : (plane.r || "UNKNOWN");
                    const latitude = plane.lat;
                    const longitude = plane.lon;
                    const altitude = plane.alt_baro || plane.alt_geom || 0; 
                    const velocity = plane.gs ? Math.round(plane.gs * 1.15078) : 0; // Knots to mph
                    const type = plane.t || "Aircraft"; 

                    if (latitude && longitude) {
                        // Double check the aircraft is within a crisp 40km range of your roof
                        const distFromHome = getDistance(homeLat, homeLng, latitude, longitude);
                        
                        if (distFromHome <= 40) {
                            const marker = L.marker([latitude, longitude])
                                .bindPopup(`<b>✈️ ${callsign} (${type})</b><br>Alt: ${altitude} ft<br>Speed: ${velocity} mph`)
                                .addTo(map);
                            markers.push(marker);

                            listDiv.innerHTML += `
                                <div class="flight-item">
                                    <strong>✈️ Target ${callsign}</strong> (${type}) | Alt: ${altitude} ft | Speed: ${velocity} mph
                                </div>`;
                        }
                    }
                });
                
                if (listDiv.innerHTML === '') {
                    listDiv.innerHTML = 'Airspace clear over Apple Valley tracking lines.';
                }
            }

            // Pinging loop interval execution parameters set to 10 seconds
            getFlights();
            setInterval(getFlights, 10000);
        });
    </script>
</body>
</html>
