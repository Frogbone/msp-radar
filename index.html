<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Live Flight Tracker</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            background-color: #111; 
            overflow: hidden;
            font-family: sans-serif;
        }
        #tracker-container {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="tracker-container">
        <iframe 
            src="https://adsb.fi/?lat=44.7375&lon=-93.2008&zoom=11" 
            allow="geolocation">
        </iframe>
    </div>

</body>
</html>
