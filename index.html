<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Live Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #111; color: #fff; }
        #map { height: 70%; width: 100%; }
        #info-panel { height: 30%; padding: 15px; box-sizing: border-box; overflow-y: auto; font-size: 1.2em; }
        .flight-item { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="info-panel">
        <h2>Flights Overhead (MSP Path)</h2>
        <div id="flights-list">Initializing radar tracking grid...</div>
    </div>

    <script>
        // Your Apple Valley home coordinate variables
        const homeLat = 44.7375513;
        const homeLng = -93.2008404;
        
        // Initialize the Leaflet Map
        const map = L.map('map').setView([homeLat, homeLng], 11); 
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker([homeLat, homeLng]).addTo(map).bindPopup('My House').openPopup();

        let markers = [];

        function clearMarkers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
        }

        // 1. Creative dynamic bypass: Injected script tag method
        function getFlights() {
            // Remove any old leftover script tag from the previous loop
            const oldScript = document.getElementById('jsonp-flight-script');
            if (oldScript) oldScript.remove();

            // Create a completely vanilla script element
            const script = document.createElement('script');
            script.id = 'jsonp-flight-script';
            
            // This pulls global aircraft data. The browser allows it completely because it's loaded as a script element.
            script.src = `https://opendata.adsb.fi/aircraft.json?callback=processFlightData&cb=${Date.now()}`;
            
            // Inject it into the page to trigger the network load
            document.body.appendChild(script);
        }

        // 2. This function runs automatically the split second the data arrives
        function processFlightData(data) {
            if (!data || !data.aircraft) {
                document.getElementById('flights-list').innerHTML = 'Searching airspace...';
                return;
            }

            // Filter the massive data list down to just planes within a rough bounding box of your house
            const lamin = 44.50, lomin = -93.50, lamax = 45.00, lomax = -92.90;
            
            const localPlanes = data.aircraft.filter(plane => {
                return plane.lat >= lamin && plane.lat <= lamax && plane.lon >= lomin && plane.lon <= lomax;
            });

            updateMapAndPanel(localPlanes);
        }

        // 3. Render the localized planes cleanly onto your tablet map
        function updateMapAndPanel(aircraftList) {
            clearMarkers();
            
            const listDiv = document.getElementById('flights-list');
            listDiv.innerHTML = '';

            if (aircraftList.length === 0) {
                listDiv.innerHTML = 'No planes detected inside local airspace right now.';
                return;
            }

            aircraftList.forEach(plane => {
                const callsign = plane.flight ? plane.flight.trim() : (plane.r || "UNKNOWN");
                const latitude = plane.lat;
                const longitude = plane.lon;
                const altitude = plane.alt_baro || plane.alt_geom || 0; 
                const velocity = plane.gs ? Math.round(plane.gs) : 0; 
                const type = plane.t || "Aircraft"; 

                if (latitude && longitude) {
                    const marker = L.marker([latitude, longitude])
                        .bindPopup(`<b>✈️ ${callsign} (${type})</b><br>Alt: ${altitude} ft<br>Speed: ${velocity} kts`)
                        .addTo(map);
                    markers.push(marker);

                    listDiv.innerHTML += `
                        <div class="flight-item">
                            <strong>✈️ Target ${callsign}</strong> (${type}) | Alt: ${altitude} ft | Speed: ${velocity} kts
                        </div>`;
                }
            });
        }

        // Loop execution parameters set to 10-second spacing cycles
        getFlights();
        setInterval(getFlights, 10000);
    </script>
</body>
</html>
